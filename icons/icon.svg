<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mein hu Hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1A17"/>
      <stop offset="1" stop-color="#0d0907"/>
    </linearGradient>
    <linearGradient id="stub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9C24A"/>
      <stop offset="1" stop-color="#F4A521"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Ticket, torn along a perforation: the same stub motif the scene
       headers use, so the tab icon and the page say the same thing. -->
  <path fill="url(#stub)" d="
    M88 152
    h230
    v40 a22 22 0 0 1 0 44
    v44 a22 22 0 0 1 0 44
    v36
    h-230
    a20 20 0 0 1 -20 -20
    v-168
    a20 20 0 0 1 20 -20
    z"/>
  <path fill="url(#stub)" d="
    M342 152
    h82
    a20 20 0 0 1 20 20
    v168
    a20 20 0 0 1 -20 20
    h-82
    v-36 a22 22 0 0 0 0 -44
    v-44 a22 22 0 0 0 0 -44
    z"/>

  <!-- H, poster-condensed, on the body of the ticket -->
  <g fill="#1E1A17">
    <rect x="128" y="196" width="32" height="120" rx="4"/>
    <rect x="228" y="196" width="32" height="120" rx="4"/>
    <rect x="128" y="240" width="132" height="32" rx="4"/>
  </g>

  <!-- three marks on the tear-off stub -->
  <g fill="#1E1A17" opacity="0.62">
    <rect x="366" y="204" width="46" height="14" rx="7"/>
    <rect x="366" y="242" width="46" height="14" rx="7"/>
    <rect x="366" y="280" width="46" height="14" rx="7"/>
  </g>
</svg>
