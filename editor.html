<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- The editor is for the organisers, not the audience: keep it out of
         search results. The site footer links here quietly for the organisers. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Script editor · Mein hu Hero</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Paint the first frame in the device's theme, as the site does;
      // editor.js keeps it in step and handles the toggle.
      (function () {
        var dark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute(
          "data-theme",
          dark ? "dark" : "light",
        );
      })();
    </script>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-title">Mein hu Hero</span>
        <span class="brand-sub">Script editor</span>
      </div>

      <nav class="tabs" aria-label="Editor sections">
        <button
          type="button"
          class="tab"
          data-tab="script"
          aria-pressed="true"
        >
          Script
        </button>
        <button
          type="button"
          class="tab"
          data-tab="cast"
          aria-pressed="false"
        >
          Cast &amp; crew
        </button>
        <button
          type="button"
          class="tab"
          data-tab="places"
          aria-pressed="false"
        >
          Places &amp; props
        </button>
        <button
          type="button"
          class="tab"
          data-tab="sounds"
          aria-pressed="false"
        >
          Songs &amp; sound effects
        </button>
        <button
          type="button"
          class="tab"
          data-tab="show"
          aria-pressed="false"
        >
          Show
        </button>
      </nav>

      <div class="actions">
        <span
          class="status"
          id="status"
          role="status"
          aria-live="polite"
        ></span>
        <button
          type="button"
          class="btn icon"
          id="undoBtn"
          title="Undo (Ctrl+Z)"
          aria-label="Undo"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
          </svg>
        </button>
        <button
          type="button"
          class="btn icon"
          id="redoBtn"
          title="Redo (Ctrl+Shift+Z)"
          aria-label="Redo"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 14 5-5-5-5" />
            <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" />
          </svg>
        </button>
        <button
          type="button"
          class="btn"
          id="previewBtn"
          title="Open the site with your unpublished changes, in a new tab"
        >
          Preview
        </button>
        <button
          type="button"
          class="btn primary"
          id="publishBtn"
          title="Send your changes to the live site"
        >
          Publish
        </button>
        <button
          type="button"
          class="btn icon theme-btn"
          id="themeBtn"
          aria-pressed="false"
          aria-label="Night mode"
          title="Switch between day and night mode for this visit"
        >
          <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
          <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
        <button
          type="button"
          class="btn icon"
          id="menuBtn"
          aria-label="More"
          title="More"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="5" cy="12" r="1.6" />
            <circle cx="12" cy="12" r="1.6" />
            <circle cx="19" cy="12" r="1.6" />
          </svg>
        </button>
      </div>
    </header>

    <main id="app">
      <p class="loading" id="loading">Loading the script…</p>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span class="toast-text" id="toastText"></span>
      <button type="button" class="toast-btn" id="toastBtn" hidden>Undo</button>
    </div>

    <dialog class="dialog" id="dialog">
      <form method="dialog" class="dialog-form" id="dialogForm">
        <h2 class="dialog-title" id="dialogTitle"></h2>
        <div class="dialog-body" id="dialogBody"></div>
        <div class="dialog-buttons" id="dialogButtons"></div>
      </form>
    </dialog>

    <input
      type="file"
      id="fileInput"
      accept=".mp3,audio/mpeg"
      hidden
    />

    <script src="editor.js"></script>
  </body>
</html>
